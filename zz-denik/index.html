<!doctype html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Zapovězené Země - Deník</title>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="background: red; color: white; padding: 20px; z-index: 9999; position: fixed; top: 0; left: 0; right: 0; bottom: 0;"><h2>GLOBAL ERROR CAUGHT</h2><p>' + e.message + '</p><p>' + e.filename + ':' + e.lineno + '</p><pre>' + (e.error && e.error.stack ? e.error.stack : '') + '</pre></div>';
    });
    window.addEventListener('unhandledrejection', function(event) {
      document.body.innerHTML = '<div style="background: red; color: white; padding: 20px; z-index: 9999; position: fixed; top: 0; left: 0; right: 0; bottom: 0;"><h2>UNHANDLED PROMISE REJECTION</h2><p>' + event.reason + '</p></div>';
    });
  </script>
</head>

<body class="overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
