<!doctype html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fdfaf3" />
  <title>Zapovězené Země - Deník</title>
  <script>
    // Téma sa musí nastaviť pred prvým vykreslením, inak používateľ
    // tmavého režimu uvidí svetlé bliknutie. Bez uloženej voľby sa
    // preberá systémové nastavenie (prefers-color-scheme).
    (function () {
      try {
        var stored = localStorage.getItem('fl_theme');
        var dark = stored
          ? stored === 'dark'
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#1a2030' : '#fdfaf3');
      } catch (e) { /* prvý štart bez prístupného localStorage */ }
    })();

    // Záchranná obrazovka pre neodchytené chyby — v dizajne aplikácie,
    // s možnosťou reštartu; technické detaily sú zbalené.
    (function () {
      function showFatalError(message, detail) {
        try {
          if (document.getElementById('fl-fatal-error')) return;
          var dark = document.documentElement.classList.contains('dark');
          var overlay = document.createElement('div');
          overlay.id = 'fl-fatal-error';
          overlay.setAttribute('role', 'alert');
          overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:' + (dark ? '#0d1118' : '#f7f1e6') + ';color:' + (dark ? '#e4ddd0' : '#2c2419') + ';font-family:Lato,sans-serif;';
          overlay.innerHTML =
            '<div style="max-width:420px;width:100%;text-align:center;">' +
            '<div style="font-size:40px;margin-bottom:12px;">&#9888;&#65039;</div>' +
            '<h2 style="font-size:20px;font-weight:700;margin:0 0 8px;">Něco se pokazilo</h2>' +
            '<p style="font-size:14px;opacity:.75;margin:0 0 20px;">Deník narazil na neočekávanou chybu. Vaše postavy zůstávají uložené v zařízení.</p>' +
            '<button onclick="location.reload()" style="min-height:48px;padding:0 28px;border:none;border-radius:24px;background:#9c6b3c;color:#fff;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;">Restartovat deník</button>' +
            '<details style="margin-top:20px;text-align:left;font-size:11px;opacity:.6;"><summary style="cursor:pointer;">Technické detaily</summary><pre style="white-space:pre-wrap;word-break:break-word;margin-top:8px;">' + message + '\n' + (detail || '') + '</pre></details>' +
            '</div>';
          (document.body || document.documentElement).appendChild(overlay);
        } catch (e) { /* nech pôvodná chyba nezanikne v handleri */ }
      }

      window.addEventListener('error', function (e) {
        showFatalError(String(e.message || e), (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (event) {
        showFatalError('Unhandled rejection: ' + String(event.reason), event.reason && event.reason.stack ? event.reason.stack : '');
      });
    })();
  </script>
</head>

<body class="overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
